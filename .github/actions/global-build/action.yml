name: 'Global Rust Compiler'
description: 'Cross-compiles binaries based on a JSON target map'

inputs:
  bin_name:
    description: 'Name of the binary to build'
    required: true

runs:
  using: "composite"
  steps:
    - name: Cache Cargo Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cross-${{ inputs.bin_name }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cross-${{ inputs.bin_name }}-

    - name: Ensure Cross is installed
      shell: bash
      run: |
        if ! command -v cross &> /dev/null; then
          echo "::group::Installing Cross"
          curl -L https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-musl.tar.gz | tar xz -C ~/.cargo/bin
          echo "::endgroup::"
        fi
  
    - name: Build and Package Binaries & Shared Libraries
      shell: bash
      run: |
        MAP_PATH="${{ github.action_path }}/targets.json"
        
        for TARGET in $(jq -r 'keys[]' "$MAP_PATH"); do
          SHORT=$(jq -r ".\"$TARGET\"" "$MAP_PATH")
          
          if [[ "$TARGET" == *"windows"* ]]; then
            BIN_EXT=".exe"
            LIB_PREFIX=""
            LIB_EXT=".dll"
          elif [[ "$TARGET" == *"apple"* ]]; then
            BIN_EXT=""
            LIB_PREFIX="lib"
            LIB_EXT=".dylib"
          else
            BIN_EXT=""
            LIB_PREFIX="lib"
            LIB_EXT=".so"
          fi
          
          echo "::group::Building $TARGET ($SHORT)"
          export CARGO_APP_VERSION="${GITHUB_REF_NAME#v}"
          
          if [[ "$TARGET" == *"musl"* ]]; then
            export RUSTFLAGS="-C target-feature=-crt-static"
          fi
          
          cross build --release --target "$TARGET"
          
          REL_DIR="target/$TARGET/release"
          
          SRC_BIN="$REL_DIR/${{ inputs.bin_name }}$BIN_EXT"
          if [[ -f "$SRC_BIN" ]]; then
            DST_BIN="${{ inputs.bin_name }}-$SHORT$BIN_EXT"
            cp "$SRC_BIN" "$DST_BIN"
            echo "Copied binary: $DST_BIN"
          fi
          
          SRC_LIB="$REL_DIR/${LIB_PREFIX}${{ inputs.bin_name }}$LIB_EXT"
          if [[ -f "$SRC_LIB" ]]; then
            DST_LIB="${LIB_PREFIX}${{ inputs.bin_name }}-$SHORT$LIB_EXT"
            cp "$SRC_LIB" "$DST_LIB"
            echo "Copied library: $DST_LIB"
          fi
          
          echo "::endgroup::"
        done
